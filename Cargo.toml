[package]
name = "web-blocker"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.44"
ctrlc = "3.5.2"
dirs = "6.0.0"
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", features = ["NSAttributedString", "NSButton", "NSFont", "NSFontDescriptor", "NSStatusBarButton"] }
objc2-foundation = { version = "0.3.2", features = ["NSAttributedString", "NSDictionary", "NSString"] }
tao = "0.35.0"
tray-icon = "0.21.3"
uuid = { version = "1.22.0", features = [ "v4" ]}
